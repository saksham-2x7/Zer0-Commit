# SUTRADHAR'S SKELETON, extended for a real Ship It deploy — Lambda + API
# Gateway + DynamoDB + S3 (redacted evidence bundles) + S3 static frontend
# hosting (see FrontendHostingBucket below). Deploy, then aws s3 sync
# frontend/dist into the FrontendBucketName output.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ScamSahayak - Ship It deploy (Lambda + API Gateway + DynamoDB + S3 + Textract + Bedrock)

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs20.x
    MemorySize: 512
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MOCK_BEDROCK: !Ref MockBedrock
        CASES_TABLE_NAME: !Ref CasesTable
        EVIDENCE_BUCKET_NAME: !Ref EvidenceBucket
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        MAX_INPUT_BYTES: !Ref MaxInputBytes

Parameters:
  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-haiku-20240307-v1:0"
    Description: Bedrock model id used by VAANI's explanation module.
  MockBedrock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "true" skips real Bedrock calls and always uses the deterministic
      fallback — only meant for local/offline dev. A real Ship It deploy
      should leave this "false" so Bedrock is actually used.
  AllowedOrigin:
    Type: String
    Default: "https://YOUR_DOMAIN.example.com"
    Description: >
      CORS origin allowed to call the API (e.g. the deployed frontend's
      URL). REPLACE this placeholder with the real frontend URL before
      deploying — a placeholder value blocks every real browser origin.
      Do not use "*" in production: it lets any website call the API.
  MaxInputBytes:
    Type: Number
    Default: 4194304
    Description: Maximum accepted raw image size, in bytes (default 4 MB).
  EvidenceRetentionDays:
    Type: Number
    Default: 30
    Description: >
      Days before a redacted evidence bundle is automatically deleted from
      S3. Kept short for a hackathon demo — there is no long-term case
      archive requirement.

Resources:
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/analyzeHandler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - Statement:
            - Sid: TextractDetectDocumentText
              Effect: Allow
              Action:
                - textract:DetectDocumentText
              # Textract does not support resource-level permissions for
              # this API — AWS requires Resource: "*" here.
              Resource: "*"
            - Sid: BedrockInvokeScopedModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            Path: /api/analyze
            Method: post
        AnalyzeApiOptions:
          Type: Api
          Properties:
            Path: /api/analyze
            Method: options

  OcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/ocrHandler.handler
      Policies:
        - Statement:
            - Sid: TextractDetectDocumentText
              Effect: Allow
              Action:
                - textract:DetectDocumentText
              Resource: "*"
      Events:
        OcrApi:
          Type: Api
          Properties:
            Path: /api/ocr
            Method: post
        OcrApiOptions:
          Type: Api
          Properties:
            Path: /api/ocr
            Method: options

  HealthTagsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/healthTagsHandler.handler
      Policies:
        - Statement:
            - Sid: BedrockInvokeScopedModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        HealthTagsApi:
          Type: Api
          Properties:
            Path: /api/health-tags
            Method: post
        HealthTagsApiOptions:
          Type: Api
          Properties:
            Path: /api/health-tags
            Method: options

  FoodFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/foodFeedbackHandler.handler
      Policies:
        - Statement:
            - Sid: BedrockInvokeScopedModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        FoodFeedbackApi:
          Type: Api
          Properties:
            Path: /api/food-feedback
            Method: post
        FoodFeedbackApiOptions:
          Type: Api
          Properties:
            Path: /api/food-feedback
            Method: options

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: caseId
          AttributeType: S
      KeySchema:
        - AttributeName: caseId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEvidenceBundles
            Status: Enabled
            ExpirationInDays: !Ref EvidenceRetentionDays
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 300

  # Static frontend hosting: serves the built React site (frontend/dist).
  # Simplest SAM-valid setup — an S3 static-website bucket + public-read
  # bucket policy. The site is not secret (same code the repo ships), it
  # only serves static assets, and it holds no user data (the private
  # EvidenceBucket above is fully blocked from public access). HTTPS is not
  # provided by the s3-website endpoint — wrap with CloudFront for
  # production/public use (see README "Frontend hosting").
  FrontendHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendHostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendHostingBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendHostingBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: "Invoke URL for POST /api/analyze"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/analyze"
  CasesTableName:
    Description: "DynamoDB table storing redacted case records"
    Value: !Ref CasesTable
  EvidenceBucketName:
    Description: "S3 bucket storing redacted evidence bundles"
    Value: !Ref EvidenceBucket
  FrontendBucketName:
    Description: "S3 bucket serving the built frontend — run: aws s3 sync frontend/dist s3://<this> --delete"
    Value: !Ref FrontendHostingBucket
  FrontendWebsiteUrl:
    Description: "Static website URL of the deployed frontend (plain HTTP — use CloudFront for HTTPS)"
    Value: !Sub "http://${FrontendHostingBucket.WebsiteURL}"
