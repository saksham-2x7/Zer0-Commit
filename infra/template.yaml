# SUTRADHAR'S SKELETON, extended for a real Ship It deploy — Lambda + API
# Gateway + DynamoDB + S3 (redacted evidence bundles) + S3 static frontend
# hosting fronted by CloudFront (private bucket, Origin Access Control,
# HTTPS via the default *.cloudfront.net domain). Deploy, then aws s3 sync
# frontend/dist into the FrontendBucketName output; the site is served at
# the FrontendUrl output.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ScamSahayak - Ship It deploy (Lambda + API Gateway + DynamoDB + S3 + Textract + Bedrock)

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs22.x
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MOCK_BEDROCK: !Ref MockBedrock
        CASES_TABLE_NAME: !Ref CasesTable
        FAMILY_TABLE_NAME: !Ref FamilyTable
        LOCATIONS_TABLE_NAME: !Ref LocationsTable
        EVIDENCE_BUCKET_NAME: !Ref EvidenceBucket
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        MAX_INPUT_BYTES: !Ref MaxInputBytes

Parameters:
  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-5-haiku-20241022-v1:0"
    Description: >
      Bedrock model id used by VAANI's explanation module. Current Haiku
      line is 3.5 (the old 3-haiku ids were retired); check the Bedrock
      console for the newest available haiku model id.
  MockBedrock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "true" skips real Bedrock calls and always uses the deterministic
      fallback — only meant for local/offline dev. A real Ship It deploy
      should leave this "false" so Bedrock is actually used.
  AllowedOrigin:
    Type: String
    Default: "https://YOUR_DOMAIN.example.com"
    Description: >
      CORS origin allowed to call the API. Set this to the deployed
      frontend's CloudFront URL (see FrontendUrl output) before deploying —
      a placeholder value blocks every real browser origin. Do not use "*"
      in production: it lets any website call the API.
  MaxInputBytes:
    Type: Number
    Default: 4194304
    Description: Maximum accepted raw image size, in bytes (default 4 MB).
  EvidenceRetentionDays:
    Type: Number
    Default: 30
    Description: >
      Days before a redacted evidence bundle is automatically deleted from
      S3. Kept short for a hackathon demo — there is no long-term case
      archive requirement.

Resources:
  # Explicit API Gateway: per-stage throttling replaces the implicit
  # ServerlessRestApi so burst/sustain limits are actually enforced.
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ScamSahayakApi
      StageName: Prod
      ThrottlingBurstLimit: 20
      ThrottlingRateLimit: 10
      TracingEnabled: true
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
          DataTraceEnabled: false
          LoggingLevel: ERROR
          MetricsEnabled: true

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/analyzeHandler.handler
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - Statement:
            - Sid: TextractDetectDocumentText
              Effect: Allow
              Action:
                - textract:DetectDocumentText
              # Textract does not support resource-level permissions for
              # this API — AWS requires Resource: "*" here.
              Resource: "*"
            - Sid: BedrockInvokeScopedModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/analyze
            Method: post
        AnalyzeApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/analyze
            Method: options

  OcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/ocrHandler.handler
      ReservedConcurrentExecutions: 10
      Policies:
        - Statement:
            - Sid: TextractDetectDocumentText
              Effect: Allow
              Action:
                - textract:DetectDocumentText
              Resource: "*"
      Events:
        OcrApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/ocr
            Method: post
        OcrApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/ocr
            Method: options

  # Pure-Bedrock handler: smaller memory, shorter timeout is plenty.
  HealthTagsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/healthTagsHandler.handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Policies:
        - Statement:
            - Sid: BedrockInvokeScopedModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        HealthTagsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/health-tags
            Method: post
        HealthTagsApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/health-tags
            Method: options

  # Pure-Bedrock handler: smaller memory, shorter timeout is plenty.
  FoodFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/foodFeedbackHandler.handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Policies:
        - Statement:
            - Sid: BedrockInvokeScopedModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        FoodFeedbackApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/food-feedback
            Method: post
        FoodFeedbackApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/food-feedback
            Method: options

  # Family circle: shared suspicious contacts, scam alerts, and member
  # allergen profiles. All state lives in the FamilyTable.
  FamilyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/familyHandler.handler
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FamilyTable
      Events:
        FamilyCreateApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/create
            Method: post
        FamilyCreateApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/create
            Method: options
        FamilyMembersApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/members
            Method: post
        FamilyMembersApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/members
            Method: options
        FamilyContactsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/contacts
            Method: post
        FamilyContactsApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/contacts
            Method: options
        FamilyAlertsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/alerts
            Method: post
        FamilyAlertsApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/alerts
            Method: options
        FamilyConfirmAlertApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/confirm-alert
            Method: post
        FamilyConfirmAlertApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/confirm-alert
            Method: options
        FamilyGetApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/{familyId}
            Method: get
        FamilyGetApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/family/{familyId}
            Method: options

  # Food allergen scanner: proxies the Open Food Facts barcode lookup and
  # flags products against the family's member allergen profiles.
  FoodLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/foodHandler.handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FamilyTable
      Events:
        FoodLookupApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/food-lookup
            Method: post
        FoodLookupApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/food-lookup
            Method: options

  # Family live location sharing: one ephemeral row per member (24h TTL) in
  # the LocationsTable, partitioned by prefixed `pk` ("loc#<familyId>#<memberId>").
  LocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/api/locationHandler.handler
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LocationsTable
      Events:
        LocationShareApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/location/share
            Method: post
        LocationShareApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/location/share
            Method: options
        LocationStopApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/location/stop
            Method: post
        LocationStopApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/location/stop
            Method: options
        LocationFamilyApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/location/family/{familyId}
            Method: get
        LocationFamilyApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /api/location/family/{familyId}
            Method: options

  # Daily blocklist reputation refresh from free public threat feeds
  # (URLhaus CSV, optionally PhishTank when PHISHTANK_API_KEY is set). Fails
  # open — any feed/DynamoDB outage logs a warning and returns synced 0, so
  # the analyze flow is never blocked. Single concurrency keeps the daily job
  # from stacking; each run overwrites rows, so a missed run self-heals.
  BlocklistSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend/blocklistSync.handler
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          TABLE_NAME: !Ref BlocklistTable
          PHISHTANK_API_KEY: ""
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlocklistTable
      Events:
        BlocklistSyncSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
            Name: ScamSahayakBlocklistSyncDaily
            Description: Daily UTC-midnight refresh of the URLhaus/PhishTank blocklist
            Enabled: true

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: caseId
          AttributeType: S
      KeySchema:
        - AttributeName: caseId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Family circle state: one item per familyId holding members, contacts,
  # and alerts. Same single-key shape as CasesTable.
  FamilyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: familyId
          AttributeType: S
      KeySchema:
        - AttributeName: familyId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # Live location state: one item per family member ("loc#<familyId>#<memberId>"),
  # auto-expiring 24h after the last share via the DynamoDB TTL attribute. The
  # same prefixed `pk` scheme as CasesTable/FamilyTable, scanned per family.
  LocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Scam blocklist reputation store: one item per blocked entity value
  # (registrable domain / UPI id / phone). PK "value" matches the PK lookup
  # in backend/reputation/blocklistCheck.js and the writes from the daily
  # BlocklistSyncFunction.
  BlocklistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: value
          AttributeType: S
      KeySchema:
        - AttributeName: value
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEvidenceBundles
            Status: Enabled
            ExpirationInDays: !Ref EvidenceRetentionDays
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 300

  # Static frontend hosting: the bucket is PRIVATE. CloudFront reaches it
  # through Origin Access Control (OAC) and serves the site over HTTPS on
  # the default *.cloudfront.net domain (no ACM/custom domain needed).
  FrontendHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: ScamSahayakFrontendOAC
        Description: OAC allowing CloudFront to read the private frontend bucket
        SigningBehavior: always
        OriginAccessControlOriginType: s3

  FrontendSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: ScamSahayakSecurityHeadersPolicy
        Comment: HSTS + X-Content-Type-Options nosniff on every frontend response
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
          ContentTypeOptions:
            Override: true

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendHostingBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeadersPolicy
          MinTTL: 0
          DefaultTTL: 60
          MaxTTL: 300
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendHostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendHostingBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendHostingBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # One CloudWatch Log Group per function, 30-day retention.
  AnalyzeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AnalyzeFunction}"
      RetentionInDays: 30

  OcrFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${OcrFunction}"
      RetentionInDays: 30

  HealthTagsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${HealthTagsFunction}"
      RetentionInDays: 30

  FoodFeedbackFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FoodFeedbackFunction}"
      RetentionInDays: 30

  FamilyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FamilyFunction}"
      RetentionInDays: 30

  FoodLookupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FoodLookupFunction}"
      RetentionInDays: 30

  LocationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LocationFunction}"
      RetentionInDays: 30

  BlocklistSyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BlocklistSyncFunction}"
      RetentionInDays: 30

  # Simple guardrail: alert when the API Gateway stage returns any 5xx in a
  # 5-minute window.
  ApiGateway5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ScamSahayak-ApiGateway-5XX
      AlarmDescription: Alert when the ScamSahayak Prod stage returns 5xx errors
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: ScamSahayakApi
        - Name: Stage
          Value: Prod

Outputs:
  ApiUrl:
    Description: "Invoke URL for POST /api/analyze"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/analyze"
  CasesTableName:
    Description: "DynamoDB table storing redacted case records"
    Value: !Ref CasesTable
  FamilyTableName:
    Description: "DynamoDB table storing family circle state"
    Value: !Ref FamilyTable
  LocationsTableName:
    Description: "DynamoDB table storing 24h live locations per family member"
    Value: !Ref LocationsTable
  BlocklistTableName:
    Description: "DynamoDB table storing blocked domains, UPI ids and phone numbers from public threat feeds"
    Value: !Ref BlocklistTable
  EvidenceBucketName:
    Description: "S3 bucket storing redacted evidence bundles"
    Value: !Ref EvidenceBucket
  FrontendBucketName:
    Description: "S3 bucket holding the built frontend — run: aws s3 sync frontend/dist s3://<this> --delete"
    Value: !Ref FrontendHostingBucket
  FrontendUrl:
    Description: "HTTPS URL of the deployed frontend (CloudFront, OAC, private bucket)"
    Value: !Sub "https://${FrontendDistribution.DomainName}"